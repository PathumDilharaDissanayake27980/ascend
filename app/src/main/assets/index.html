<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ascend</title>
<meta name="theme-color" content="#0B111F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0B111F; --panel:#111A2E; --panel2:#0E1728; --raise:#17233D;
  --line:rgba(125,158,212,.15); --line2:rgba(125,158,212,.3);
  --text:#DEE7F5; --muted:#8DA1C0; --faint:#5E7characters;
  --accent:#FFB454; --accent2:#6FA7FF;
  --ok:#5FD39B; --warn:#FF8E72; --r:14px;
}:root{ --faint:#5E749A; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
  min-height:100vh; overflow-x:hidden;
}
#wall{position:fixed;inset:0;z-index:0;pointer-events:none}:selection{background:rgba(255,180,84,.28)}
button{font-family:inherit}

/* header */
header{
  position:sticky;top:0;z-index:25;
  background:linear-gradient(180deg,rgba(17,26,46,.96),rgba(11,17,31,.92));
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}.hbar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1320px;margin:0 auto}.iconbtn{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  width:40px;height:40px;flex:0 0 auto;cursor:pointer;position:relative;color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}.iconbtn:hover{border-color:var(--line2)}.burger,.burger:before,.burger:after{position:absolute;left:11px;width:18px;height:2px;background:var(--text);border-radius:2px;transition:transform.22s,opacity.22s}.burger{top:19px}.burger:before{content:"";top:-6px}.burger:after{content:"";top:6px}
body.nav-open.burger{background:transparent}
body.nav-open.burger:before{transform:translateY(6px) rotate(45deg)}
body.nav-open.burger:after{transform:translateY(-6px) rotate(-45deg)}.htitle{flex:1 1 auto;min-width:0}.htitle b{display:block;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.htitle span{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);letter-spacing:.06em}.hstat{display:flex;gap:7px;flex:0 0 auto}.pill{
  background:var(--panel2);border:1px solid var(--line);border-radius:99px;
  padding:6px 11px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}.pill b{color:var(--accent);font-weight:500}.tabsbar{display:flex;gap:4px;padding:0 10px 9px;max-width:1320px;margin:0 auto;overflow-x:auto;scrollbar-width:none}.tabsbar:-webkit-scrollbar{display:none}.vtab{
  background:transparent;border:1px solid transparent;border-radius:9px;color:var(--muted);
  font-size:13px;font-weight:500;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:.18s;
}.vtab:hover{color:var(--text)}.vtab.on{background:var(--raise);border-color:var(--line);color:var(--text)}

/* layout */.wrap{position:relative;display:grid;grid-template-columns:250px 1fr;gap:22px;max-width:1320px;margin:0 auto;padding:20px 16px 90px}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 130px);overflow-y:auto}
aside:-webkit-scrollbar{width:5px}aside:-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
main{min-width:0}.scrim{position:fixed;inset:0;background:rgba(5,9,18,.65);backdrop-filter:blur(2px);z-index:30;opacity:0;transition:opacity.25s}
body.nav-open.scrim{opacity:1}.sideh{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:14px 8px 6px}.sideh:first-child{margin-top:0}.srow{
  display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:1px solid transparent;
  border-radius:9px;color:var(--muted);font-size:13.5px;padding:8px 10px;cursor:pointer;text-align:left;transition:.16s;
}.srow:hover{background:rgba(111,167,255,.06);color:var(--text)}.srow.on{background:var(--panel);border-color:var(--line);color:var(--text)}.dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}.srow.frac{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)}

/* cards */.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}.card h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--accent);margin-bottom:10px;display:flex;align-items:baseline;gap:9px}.card h3 small{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:400;color:var(--faint)}

/* day header */.dayhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}.dayhead h2{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;letter-spacing:-.01em}.dayhead.sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);margin-top:2px}.daynav{display:flex;gap:6px;margin-left:auto}.gbtn{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 12px;cursor:pointer;transition:.18s;
}.gbtn:hover{color:var(--accent);border-color:var(--line2)}.gbtn.solid{background:var(--accent);color:#12182A;border-color:var(--accent);font-weight:500}

/* progress ring row */.summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,180,84,.08),rgba(111,167,255,.05));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}.ring{width:78px;height:78px;transform:rotate(-90deg);flex:0 0 auto}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.rbg{stroke:rgba(125,158,212,.14)}.rfg{stroke:var(--accent);stroke-dasharray:220;transition:stroke-dashoffset.5s cubic-bezier(.22,1,.36,1)}.ringwrap{position:relative;width:78px;height:78px}.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.ringtxt b{font-family:'Space Grotesk',sans-serif;font-size:19px}.ringtxt span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);margin-top:2px}.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:12px;flex:1 1 220px}.mini div b{display:block;font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--accent)}.mini div span{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}

/* timeline slots */.slots{position:relative}.slot{
  display:flex;gap:11px;align-items:stretch;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative;
  transition:border-color.18s,transform.18s,box-shadow.18s,opacity.18s;
  touch-action:pan-y;
}.slot:hover{border-color:var(--line2)}.slot.done{opacity:.5}.slot.done.stitle{text-decoration:line-through;text-decoration-color:rgba(140,160,191,.6)}.slot.now{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,180,84,.25)}.slot.drag{opacity:.9;transform:scale(1.02);box-shadow:0 14px 34px rgba(0,0,0,.5);border-color:var(--accent);z-index:5;cursor:grabbing}.slot.ghost{opacity:.28;border-style:dashed}.stime{
  flex:0 0 52px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;gap:2px;padding-top:2px;
}.stime b{font-weight:500;color:var(--text)}.stime span{font-size:9.5px;color:var(--faint)}.sbar{width:3px;border-radius:3px;flex:0 0 auto;background:var(--accent2)}.sbody{flex:1 1 auto;min-width:0}.stag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}.stitle{font-size:14px;font-weight:500;line-height:1.35;word-break:break-word}.ssub{font-size:11.5px;color:var(--faint);margin-top:2px}.sact{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;flex:0 0 auto}.tick{
  appearance:none;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:7px;
  background:transparent;cursor:pointer;position:relative;flex:0 0 auto;
}.tick:checked{background:var(--accent);border-color:var(--accent)}.tick:checked:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #101728;border-width:0 2px 2px 0;transform:rotate(42deg)}.grip{
  width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:transparent;
  color:var(--faint);cursor:grab;display:flex;align-items:center;justify-content:center;font-size:13px;
  touch-action:none;
}.grip:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}.rest.sbar{background:var(--muted);opacity:.5}.rest.stitle{color:var(--muted);font-weight:400}.free{border-style:dashed;opacity:.75}.free.stitle{color:var(--faint);font-style:italic}.nowline{height:2px;background:var(--accent);border-radius:2px;margin:2px 0 10px;position:relative}.nowline:after{content:"NOW";position:absolute;right:0;top:-16px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent)}

/* week view */.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.wday{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:120px;transition:.18s}.wday.today{border-color:var(--accent)}.wday.over{border-color:var(--accent);background:var(--raise)}.wday h4{font-family:'Space Grotesk',sans-serif;font-size:13px;margin-bottom:2px;cursor:pointer}.wday.wsub{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);margin-bottom:8px}.witem{font-size:11.5px;color:var(--muted);padding:4px 6px;border-radius:6px;margin-bottom:3px;display:flex;gap:6px;align-items:baseline}.witem i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);flex:0 0 34px}.witem.d{opacity:.45;text-decoration:line-through}

/* sheet */.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform.3s cubic-bezier(.22,1,.36,1);max-height:86vh;overflow-y:auto;
  box-shadow:0 -18px 50px rgba(0,0,0,.5);
}.sheet.open{transform:none}.sheet.handle{width:38px;height:4px;background:var(--line2);border-radius:9px;margin:0 auto 14px}.sheet h4{font-family:'Space Grotesk',sans-serif;font-size:17px;margin-bottom:4px}.sheet.meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);margin-bottom:14px}.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}.sbtn{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-size:13px;padding:11px 12px;cursor:pointer;text-align:left;transition:.18s;
}.sbtn:hover{border-color:var(--line2);background:var(--raise)}.sbtn small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px;font-family:'JetBrains Mono',monospace}.sbtn.warn{color:var(--warn)}.reflink{
  display:inline-flex;align-items:center;gap:7px;background:rgba(111,167,255,.1);border:1px solid rgba(111,167,255,.3);
  color:var(--accent2);border-radius:9px;padding:9px 12px;font-size:12.5px;text-decoration:none;margin-bottom:12px;
}.reflink:hover{background:rgba(111,167,255,.18)}
input[type=text],input[type=password],input[type=time],input[type=date],input[type=number],select,textarea{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);
  font:inherit;font-size:13.5px;padding:9px 11px;outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
label.fl{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}

/* settings */.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed rgba(125,158,212,.12)}.setrow:last-child{border:0}.setrow > label{flex:0 0 148px;font-size:13px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 11px;cursor:pointer;transition:.18s}.chip:hover{border-color:var(--line2);color:var(--text)}.chip.on{background:rgba(255,180,84,.16);border-color:rgba(255,180,84,.5);color:var(--accent)}.swatch{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer}.swatch.on{border-color:var(--text)}.rowline{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:nowrap}.rowline.fx{flex-wrap:wrap}.rowline span{font-size:12px;color:var(--faint)}.rowline input[type=time]{width:118px}.rowline select{width:auto;flex:1 1 110px}.xbtn{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--warn);width:32px;height:34px;cursor:pointer;font-size:15px}.xbtn:hover{border-color:var(--warn)}.hint{font-size:11px;color:var(--faint);margin:2px 0 8px;font-family:'JetBrains Mono',monospace}.warnhint{color:var(--warn)}.preview{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.preview b{font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--accent)}.preview span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}.daybtn{
  display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:7px;cursor:pointer;text-align:left;color:var(--text);transition:.18s;
}.daybtn:hover{border-color:var(--line2);background:var(--raise)}.daybtn.dn{font-size:13.5px;font-weight:500;flex:0 0 92px}.daybtn.dr{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);flex:1 1 auto}.daybtn.dm{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint)}
@media (max-width:520px){.daybtn{flex-wrap:wrap;gap:3px}.daybtn.dn{flex:1 1 100%} }.mgrp{margin-bottom:10px}.mgrp-t{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:4px}.mgrp-i{font-size:12.5px;color:var(--muted);padding:2px 0 2px 8px;border-left:2px solid var(--line)}.offday{text-align:center;padding:30px 16px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r)}.offday b{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:6px}.offday span{font-size:13.5px;color:var(--muted)}.badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--raise);color:var(--faint);margin-left:6px}.badge.off{color:var(--warn)}.badge.big{color:var(--accent)}.daybar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.dbtn{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--muted);
  font-size:12.5px;font-weight:500;padding:8px 13px;cursor:pointer;transition:.18s;
}.dbtn:hover{color:var(--text);border-color:var(--line2);background:var(--raise)}.dbtn.primary{background:rgba(255,180,84,.14);border-color:rgba(255,180,84,.45);color:var(--accent)}.dbtn.primary:hover{background:rgba(255,180,84,.22)}.dbtn.revert{color:var(--accent2);border-color:rgba(111,167,255,.35)}.dayhint{font-size:11.5px;color:var(--faint);margin-bottom:14px;line-height:1.45}.dayhint b{color:var(--muted);font-weight:500}.calbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}.calhd{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);text-align:center;padding-bottom:3px;letter-spacing:.06em}.calcell{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  min-height:56px;padding:5px 4px 4px;cursor:pointer;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s;

@media (max-width:420px){.calcell{min-height:50px}.calcell.cd{font-size:12px} }.trackcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;color:var(--text);transition:.18s}.trackcard:hover{border-color:var(--line2);transform:translateY(-1px)}.tc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}.tc-top b{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;flex:1 1 auto}.tc-frac{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint)}.tc-bar{height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}.tc-bar i{display:block;height:100%;border-radius:9px}.tc-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);margin-top:7px}.guide{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px}.guide b{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}.guide p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:9px}.guide p:last-child{margin-bottom:0}.guide.sm{margin:10px 0}.guide.sm p{font-size:12.5px}.course{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}.course-h{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;color:var(--text);padding:12px 13px;cursor:pointer;text-align:left}.course-h:hover{background:var(--raise)}.course-h b{flex:1 1 auto;font-size:13.5px;font-weight:500}.chev{color:var(--faint);font-size:11px;flex:0 0 10px}.c-frac{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint)}.c-frac.full{color:var(--ok)}.course-d{font-size:12.8px;color:var(--muted);line-height:1.55;padding:0 13px 10px}.course.reflink{margin:0 13px 10px}.les /* ============ modern pass ============ */:root{
  --bg:#070B14;
  --panel:rgba(21,30,50,.66);
  --panel2:rgba(13,20,36,.72);
  --raise:rgba(32,44,71,.72);
  --line:rgba(140,170,220,.13);
  --line2:rgba(140,170,220,.26);
  --text:#E6EDF9;
  --muted:#97A9C6;
  --faint:#647busy;
  --faint:#6478A0;
  --r:18px;
  --shadow:0 18px 48px rgba(0,0,0,.42);
  --glass:saturate(150%) blur(18px);
}
body{
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(255,180,84,.10), transparent 62%),
    radial-gradient(900px 560px at -6% 8%, rgba(111,167,255,.11), transparent 60%),
    radial-gradient(760px 520px at 50% 112%, rgba(199,146,234,.08), transparent 60%),
    var(--bg);
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}

/* header ------------------------------------------------ */
header{
  background:linear-gradient(180deg, rgba(10,15,27,.86), rgba(7,11,20,.62));
  backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
  border-bottom:1px solid rgba(140,170,220,.1);
}.hbar{padding:12px 16px 10px}.htitle b{font-size:17px;letter-spacing:-.02em}.htitle span{font-size:10px;opacity:.85}.iconbtn{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(180deg, rgba(45,60,92,.5), rgba(24,34,56,.5));
  border:1px solid var(--line);
}.iconbtn:active{transform:scale(.94)}.pill{
  border-radius:999px;padding:7px 12px;font-size:11px;
  background:linear-gradient(180deg, rgba(45,60,92,.42), rgba(20,29,49,.42));
  border:1px solid var(--line);backdrop-filter:blur(8px);
}.tabsbar{padding:0 12px 10px;gap:5px}.vtab{
  border-radius:11px;padding:8px 15px;font-size:13px;font-weight:500;letter-spacing:-.01em;
  transition:background.2s cubic-bezier(.22,1,.36,1), color.2s, transform.16s;
}.vtab:active{transform:scale(.96)}.vtab.on{
  background:linear-gradient(180deg, rgba(58,76,116,.62), rgba(31,43,70,.62));
  border-color:var(--line2);
  box-shadow:0 3px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
}

/* surfaces ---------------------------------------------- */.card,.trackcard,.course,.wday,.offday,.preview,.guide{
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}.card{
  border-radius:var(--r);padding:18px;
  background:linear-gradient(160deg, rgba(28,39,63,.6), rgba(15,22,39,.6));
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.22);
}.card h3{font-size:14.5px;letter-spacing:-.01em;margin-bottom:12px}.dayhead h2{font-size:26px;letter-spacing:-.025em;font-weight:600}.summary{
  border-radius:var(--r);padding:18px;
  background:linear-gradient(150deg, rgba(255,180,84,.10), rgba(111,167,255,.07) 55%, rgba(199,146,234,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 34px rgba(0,0,0,.24);
}.mini div b{font-size:19px;letter-spacing:-.02em}.ringtxt b{font-size:20px;letter-spacing:-.02em}.rfg{filter:drop-shadow(0 0 6px rgba(255,180,84,.45))}

/* slots -------------------------------------------------- */.slot{
  border-radius:15px;padding:12px 13px;margin-bottom:9px;gap:12px;
  background:linear-gradient(150deg, rgba(27,38,62,.6), rgba(14,21,38,.6));
  border-color:rgba(140,170,220,.11);
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  transition:transform.2s cubic-bezier(.22,1,.36,1), border-color.2s, box-shadow.2s, opacity.2s;
}.slot:active{transform:scale(.995)}.slot:hover{box-shadow:0 8px 26px rgba(0,0,0,.3)}.slot.now{
  border-color:rgba(255,180,84,.55);
  box-shadow:0 0 0 1px rgba(255,180,84,.22), 0 10px 30px rgba(255,180,84,.10);
}.sbar{width:4px;border-radius:4px;opacity:.9}.stitle{font-size:14.5px;letter-spacing:-.01em;font-weight:500}.stag{font-size:9px;letter-spacing:.14em;opacity:.95}.stime b{font-size:12px;letter-spacing:-.01em}.tick{width:24px;height:24px;border-radius:8px;border-width:1.5px;transition:transform.18s cubic-bezier(.34,1.56,.64,1),background.18s}.tick:checked{animation:pop.3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{50%{transform:scale(1.22)}}.tick:checked:after{left:8px;top:4px}.grip{width:30px;height:30px;border-radius:9px}.slot.drag{box-shadow:0 22px 46px rgba(0,0,0,.55);border-color:var(--accent)}

/* buttons ------------------------------------------------ */.dbtn,.gbtn,.chip,.sbtn,.tool-btn{
  border-radius:12px;
  transition:transform.16s cubic-bezier(.22,1,.36,1), background.2s, border-color.2s, color.2s;
}.dbtn:active,.gbtn:active,.chip:active,.sbtn:active{transform:scale(.96)}.dbtn{padding:9px 14px;font-size:13px;background:linear-gradient(180deg, rgba(42,57,89,.5), rgba(20,29,49,.5))}.dbtn.primary{
  background:linear-gradient(180deg, rgba(255,180,84,.24), rgba(255,180,84,.12));

}.gbtn{padding:8px 13px;border-radius:11px}.gbtn.solid{box-shadow:0 5px 18px rgba(255,180,84,.24)}.sbtn{padding:13px 14px;border-radius:14px;background:linear-gradient(160deg, rgba(34,47,75,.6), rgba(17,25,44,.6))}.sbtn:hover{border-color:var(--line2)}

/* sheet -------------------------------------------------- */.sheet{
  border-radius:26px 26px 0 0;padding:14px 18px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(26,36,59,.94), rgba(13,19,34,.97));
  backdrop-filter:var(--glass);border-top:1px solid var(--line2);
  box-shadow:0 -24px 70px rgba(0,0,0,.6);
}.sheet h4{font-size:18px;letter-spacing:-.02em}.sheet.handle{width:44px;height:5px;border-radius:99px;margin-bottom:16px;background:rgba(140,170,220,.32)}

/* library ------------------------------------------------ */.trackcard{border-radius:var(--r);padding:16px;background:linear-gradient(160deg, rgba(28,39,63,.58), rgba(15,22,39,.58))}.trackcard:active{transform:scale(.985)}.tc-top b{font-size:15px;letter-spacing:-.015em}.tc-bar{height:7px;border-radius:99px}.tc-bar i{box-shadow:0 0 10px currentColor}.course{border-radius:16px;background:linear-gradient(160deg, rgba(26,36,59,.55), rgba(14,21,38,.55))}.course-h{padding:14px}.guide{border-radius:14px;border-left-width:3px}.lesson{border-radius:10px;padding:8px 9px}

/* calendar ----------------------------------------------- */.calcell{
  border-radius:13px;min-height:60px;
  background:linear-gradient(160deg, rgba(27,38,62,.55), rgba(14,21,38,.55));
  transition:transform.16s cubic-bezier(.22,1,.36,1), background.2s, border-color.2s;
}.calcell:active{transform:scale(.93)}.calcell.sel{
  background:linear-gradient(160deg, rgba(255,180,84,.26), rgba(255,180,84,.12));
  box-shadow:0 6px 20px rgba(255,180,84,.18);
}.calcell.today{box-shadow:0 0 0 1px rgba(255,180,84,.3)}.calcell.cd{font-size:14px;letter-spacing:-.02em}

/* week --------------------------------------------------- */.wday{border-radius:16px;background:linear-gradient(160deg, rgba(27,38,62,.55), rgba(14,21,38,.55))}.witem{border-radius:9px;padding:6px 8px}.witem:active{background:var(--raise)}

/* inputs ------------------------------------------------- */
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{
  border-radius:12px;padding:11px 13px;background:rgba(11,17,31,.7);
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(111,167,255,.16)}

/* toast -------------------------------------------------- */
#toast{
  border-radius:14px;padding:13px 18px;
  background:linear-gradient(180deg, rgba(38,52,82,.96), rgba(22,31,52,.96));
  backdrop-filter:var(--glass);box-shadow:0 16px 42px rgba(0,0,0,.55);
}

/* bottom nav (mobile) ------------------------------------ */.bnav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:28;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(12,18,32,.82), rgba(7,11,20,.96));
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border-top:1px solid rgba(140,170,220,.12);
}.bnav-in{display:flex;gap:2px;max-width:520px;margin:0 auto}.bitem{
  flex:1;background:none;border:0;color:var(--faint);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;
  font-size:9.5px;font-weight:500;letter-spacing:.01em;border-radius:12px;
  transition:color.2s, background.2s, transform.16s;
}.bitem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.bitem:active{transform:scale(.92)}.bitem.on{color:var(--accent);background:rgba(255,180,84,.1)}

@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:14px 12px 90px;gap:0}
  aside{
    position:fixed;top:0;left:0;bottom:0;width:272px;max-width:84vw;z-index:31;
    background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;

  }

}

  #toast{bottom:88px}.hbar{padding:11px 14px}.dayhead h2{font-size:23px}.card{padding:16px}.calcell{min-height:56px}
}
@media (min-width:901px){.bnav{display:none} }

/* polish pass */.dayhint{margin-bottom:16px;font-size:12px;line-height:1.5}.daybar{gap:8px;margin-bottom:10px}.summary{margin-bottom:16px}.mini{gap:14px}.mini div span{font-size:9px;letter-spacing:.08em;opacity:.9}.nowline{background:linear-gradient(90deg,var(--accent),transparent);height:2px;margin:6px 0 12px}.nowline:after{font-size:8.5px;letter-spacing:.14em;top:-15px}.stime{flex:0 0 54px}.ssub{font-size:11px;opacity:.85;margin-top:3px}.sheet.meta{font-size:11.5px;margin-bottom:16px;opacity:.9}.sgrid{gap:9px}.sbtn small{margin-top:3px;line-height:1.35}.reflink{border-radius:12px;padding:11px 14px;font-size:13px}.callegend{margin-bottom:16px;opacity:.9}.calgrid{gap:6px}.calhd{font-size:9px;opacity:.8}.empty,.hint{line-height:1.55}.offday{border-radius:var(--r);padding:34px 18px;background:linear-gradient(160deg, rgba(28,39,63,.5), rgba(15,22,39,.5))}.offday b{font-size:20px;letter-spacing:-.02em}
h2,h3,h4,.tc-top b,.stitle{text-wrap:balance}

.grab .handle{margin:0 auto}
.sheet .handle{width:44px;height:5px;border-radius:99px;background:rgba(140,170,220,.34);transition:background .2s,width .2s}
.grab:active .handle{background:rgba(140,170,220,.6);width:52px}

aside{will-change:transform;touch-action:pan-y}
@media (max-width:900px){
  aside{transition:transform .3s cubic-bezier(.32,.72,0,1)}
}
.scrim{transition:opacity .28s cubic-bezier(.32,.72,0,1)}
.balrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(125,158,212,.1);flex-wrap:wrap}
.balrow:last-of-type{border-bottom:0}
.balrow b{font-size:13px;font-weight:500;flex:1 1 120px}
.balnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
.balrem{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex:0 0 auto}
/* ---------- six-track guide, ShiftWise link, motion ---------- */
.stask{margin-top:4px;font-size:11.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.done .stask{display:none}
.taskbox{margin:10px 0 12px;padding:11px 13px;border-radius:12px;background:linear-gradient(135deg,rgba(255,180,84,.12),rgba(111,167,255,.08));border:1px solid rgba(255,180,84,.3)}
.taskbox b{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.taskbox p{font-size:13.5px;line-height:1.5}
.swmark{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px;background:linear-gradient(135deg,#f6cbf1 0 25%,#cfe9b6 25% 50%,#ffd699 50% 75%,#e2e2e2 75%);box-shadow:inset 0 0 0 1.5px #5cc2ae}
.swday{display:flex;align-items:center;gap:2px;margin:-4px 0 14px;font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.02em}
.swday.warn{color:var(--warn)}
.swcard{border-color:rgba(92,194,174,.35)!important;background:linear-gradient(150deg,rgba(92,194,174,.12),rgba(17,26,46,.6) 60%)!important}
.dbtn.sw{border-color:rgba(92,194,174,.45);color:#7fd8c5}
@keyframes ascend-rise{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
#main.enter > *{animation:ascend-rise .5s cubic-bezier(.22,1,.36,1) both}
#main.enter > *:nth-child(2){animation-delay:.04s}#main.enter > *:nth-child(3){animation-delay:.08s}#main.enter > *:nth-child(4){animation-delay:.12s}#main.enter > *:nth-child(n+5){animation-delay:.16s}
.slot,.trackcard,.sbtn,.dbtn,.gbtn,.chip{transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .2s,border-color .2s,background-color .2s,box-shadow .25s}
.slot:active,.trackcard:active,.sbtn:active,.dbtn:active,.gbtn:active,.chip:active{transform:scale(.97)}
.slot.now{box-shadow:0 0 0 1px var(--accent),0 10px 30px -12px var(--accent)}
@media (prefers-reduced-motion:reduce){#main.enter > *{animation:none}.slot,.trackcard,.sbtn,.dbtn,.gbtn,.chip{transition:none}}
</style>
</head>

function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }

function fmtTime(mins){

  return h12+":"+String(mm).padStart(2,"0")+" "+ap;
}

}

function nativeBridge(){
  try{ return (typeof AndroidBridge!=="undefined" && AndroidBridge && AndroidBridge.isNative && AndroidBridge.isNative()) ? AndroidBridge: null; }
  catch(e){ return null; }
}
async function rawGet(k){
  try{ if(window.storage){ const r=await window.storage.get(k); if(r&&r.value) return r.value; } }catch(e){}
  let web=null;
  try{ web=localStorage.getItem(k); }catch(e){ memoryOnly=true; }
  // the Android app keeps a second copy outside the WebView, so nothing is lost
  // if WebView storage is cleared by the system
  let nat=null;
  const B=nativeBridge();
  if(B && B.load){ try{ const v=B.load(k); if(v) nat=v; }catch(e){} }
  if(web && nat) return web.length>=nat.length ? web: nat;
  return web || nat;
}

  const raw = await rawGet(KEY);

/* Template model (per weekday, and overridable per date):
   win: [[startMin,endMin],...]  continuous available windows (end may exceed 1440 = past midnight)
   fix: [[kind,startMin,len],...] anchored blocks (dinner, entertainment, gym...)
   out: [[startMin,endMin],...]  blackout, never schedule here
   len: default study block length
   brk: break length; every: break after N study blocks
   order: track rotation for this day
*/
let uidc=0;
function uid(){ return "s"+Date.now().toString(36)+(uidc++).toString(36); }

function lkey(track,i){ return track+"|"+i; }
function isLessonDone(track,i){ return !!(S.ldone && S.ldone[lkey(track,i)]); }
function poolItem(track,i){
  const raw=(POOLS[track]||[])[i];
  return (typeof raw==="string")?{t:raw,c:""}:(raw||{t:"",c:""});
}
/* indices still to be studied, in order */
function remainingIdx(track){
  const pool=POOLS[track]||[];
  const out=[];
  for(let i=0;i<pool.length;i++){ if(!isLessonDone(track,i)) out.push(i); }
  return out;
}
function doneCount(track){
  const pool=POOLS[track]||[];
  let n=0;
  for(let i=0;i<pool.length;i++){ if(isLessonDone(track,i)) n++; }
  return n;
}
/* n = this track's session number since the plan started */
function lessonAt(track,n){
  const pool=POOLS[track];
  if(!pool||!pool.length) return {t:TRACKS[track]?TRACKS[track].n:track,c:""};
  const rem=schedIdx(track);
  if(!rem.length){
    // everything studied once, cycle the whole pool as revision
    const i=n%pool.length, it=poolItem(track,i);
    return {t:"Review: "+it.t, c:it.c, idx:i, pass:1};
  }
  // n counts this track's sessions from today, so it points straight at what is left
  const pass=Math.floor(n/rem.length);
  const i=rem[n%rem.length];
  const it=poolItem(track,i);
  if(pass===0) return {t:it.t, c:it.c, idx:i};
  const label = pass===1 ? "Review: ": "Deepen ("+(pass+1)+"x): ";
  return {t:label+it.t, c:it.c, idx:i, pass};
}

/* find a sensible home for a fixed block inside the available windows */
function anchorFor(kind, len, wins, outs){
  const fits=(a)=>{
    const b=a+len;
    if(!wins.some(w=>a>=w[0]&&b<=w[1])) return false;
    return !(outs||[]).some(o=>a<o[1]&&b>o[0]);
  };
  const prefer = kind==="din" ? [12*60+30, 13*60, 19*60+30, 18*60+30, 20*60]: kind==="ent" ? [22*60, 20*60, 21*60, 19*60]: [];
  for(const t of prefer){ if(fits(t)) return t; }
  // otherwise: first slot on a 15-minute grid, biased to the middle of the day
  const cands=[];
  wins.forEach(w=>{ for(let t=Math.ceil(w[0]/15)*15; t+len<=w[1]; t+=15) cands.push(t); });
  if(!cands.length) return wins.length?wins[0][0]:0;
  const mid=(wins[0][0]+wins[wins.length-1][1])/2;
  cands.sort((a,b)=>Math.abs(a+len/2-mid)-Math.abs(b+len/2-mid));
  for(const t of cands){ if(fits(t)) return t; }
  return cands[0];
}

/* subtract a list of [a,b] ranges from a window */
function subtract(win, cuts){
  let parts=[win];
  cuts.forEach(([ca,cb])=>{
    const next=[];
    parts.forEach(([a,b])=>{
      if(cb<=a || ca>=b){ next.push([a,b]); return; }
      if(ca>a) next.push([a,Math.min(ca,b)]);
      if(cb<b) next.push([Math.max(cb,a),b]);
    });
    parts=next;
  });
  return parts.filter(([a,b])=>b-a>=5);
}

function tmplFor(dateKey){
  if(S.custom && S.custom[dateKey]) return S.custom[dateKey];
  return S.tmpl[parseKey(dateKey).getDay()];
}

/* build the day's structure (no lessons attached yet) */
const STRUCT_CACHE={};
function structVersion(){ return (S.__sv=S.__sv||0); }
function bumpStruct(){ S.__sv=(S.__sv||0)+1; for(const k in STRUCT_CACHE) delete STRUCT_CACHE[k]; }
function structure(dateKey){
  const ck=dateKey+"|"+structVersion();
  if(STRUCT_CACHE[ck]) return STRUCT_CACHE[ck];
  const out=structureRaw(dateKey);
  STRUCT_CACHE[ck]=out;
  return out;
}
function structureRaw(dateKey){
  const t=tmplFor(dateKey);
  if(!t || !t.win || !t.win.length) return [];
  const MIN=15;
  const inWin=(a,b)=>(t.win||[]).some(w=>a<w[1]&&b>w[0]);
  const fixed=(t.fix||[]).map(([k,st,m])=>({k, st, m})).filter(f=>inWin(f.st, f.st+f.m));
  const cuts=(t.out||[]).concat(fixed.map(f=>[f.st, f.st+f.m]));
  let free=[];
  t.win.forEach(w=>{ free=free.concat(subtract(w, cuts)); });
  free.sort((a,b)=>a[0]-b[0]);

  const out=[];
  let sinceBreak=0;
  free.forEach(([a,b])=>{
    let cur=a;
    const blocks=[];
    while(b-cur >= MIN){
      const room=b-cur;
      if(sinceBreak >= (t.every||2) && room > (t.brk||10)+MIN){
        blocks.push({k:"brk", st:cur, m:t.brk||10});
        cur += t.brk||10; sinceBreak=0; continue;
      }
      let len=Math.min(t.len||45, room);
      // if the leftover would be too small to use, absorb it
      if(room-len>0 && room-len<MIN) len=room;
      blocks.push({k:"study", st:cur, m:len});
      cur+=len; sinceBreak++;
    }
    // trailing sliver
    if(b-cur>0 && blocks.length){ blocks[blocks.length-1].m += b-cur; }
    out.push(...blocks);
    sinceBreak=0;
  });
  fixed.forEach(f=>out.push({k:f.k, st:f.st, m:f.m}));
  out.sort((a,b)=>a.st-b.st);
  return out;
}

/* how many study blocks a day has (used for the deterministic lesson cursor) */
const ORD={};
function studyCount(dateKey){ return structure(dateKey).filter(b=>b.k==="study").length; }
function orderOf(dateKey){ const t=tmplFor(dateKey); return (t&&t.order&&t.order.length)?t.order:["se"]; }

/* cumulative count of each track's sessions before dateKey */
function planAnchor(){ const t=todayKey(); return S.start>t ? S.start: t; }
function ordinals(dateKey){
  if(ORD[dateKey]) return ORD[dateKey];
  const anchor=planAnchor();
  if(dateKey<=anchor){ const z={}; ORD[dateKey]=z; return z; }
  const prev=addDays(dateKey,-1);
  const base=Object.assign({}, ordinals(prev));
  const ord=orderOf(prev);
  const n=studyCount(prev);
  for(let i=0;i<n;i++){ const k=ord[i%ord.length]; base[k]=(base[k]||0)+1; }
  ORD[dateKey]=base;
  return base;
}
function clearOrd(){ for(const k in ORD) delete ORD[k]; bumpStruct(); }

function generateDay(dateKey){
  const st=structure(dateKey);
  if(!st.length) return [];
  const base=Object.assign({}, ordinals(dateKey));
  const ord=orderOf(dateKey);
  let si=0;
  return st.map(b=>{
    const it={id:uid(), m:b.m, st:b.st, done:false};
    if(b.k==="study"){
      const track=ord[si%ord.length]; si++;
      const n=base[track]||0; base[track]=n+1;
      const L=lessonAt(track,n);
      it.k=track; it.title=L.t; it.course=L.c; it.n=n; if(L.idx!=null) it.li=L.idx;
    }else{
      it.k=b.k; it.title=RESTNAME[b.k]||(TRACKS[b.k]?TRACKS[b.k].n:"Block");
    }
    return it;
  });
}

function getDay(dateKey){
  if(!S.days[dateKey]){ S.days[dateKey]=generateDay(dateKey); save(); }
  return S.days[dateKey];
}
/* re-stack times after a reorder, keeping the day's first start */
/* re-stack times only after a reorder or resize made blocks overlap. Blocks stay inside the
   day's windows, so a gap (a shift, a meal, sleep) is never filled with study */
function retime(dateKey){
  const items=S.days[dateKey]||[];
  if(!items.length) return;
  let ordered=true;
  for(let i=1;i<items.length;i++){ if(items[i].st < items[i-1].st+items[i-1].m){ ordered=false; break; } }
  if(ordered) return;
  const t=tmplFor(dateKey);
  const wins=(t&&t.win&&t.win.length)?t.win.slice().sort((a,b)=>a[0]-b[0]):[[items[0].st, items[0].st+2880]];
  let wi=0, cur=wins[0][0];
  items.forEach(it=>{
    while(wi<wins.length-1 && cur+it.m>wins[wi][1]){ wi++; cur=Math.max(cur, wins[wi][0]); }
    it.st=cur; cur+=it.m;
  });
}

/* ================= guide pacing ================= */
function weekStudyMin(){ const w=S.sw&&S.sw.week; return w?(w.learn||0)+(w.build||0)+(w.cert||0):0; }
function guideMonth(){ return window.GUIDE?GUIDE.month(S.start, todayKey(), weekStudyMin()):1; }
function unfinished(track){ return remainingIdx(track).length>0; }
/* lessons that are due: projects and exams open when the guide reaches their month */
function schedIdx(track){
  const rem=remainingIdx(track);
  if(!window.GUIDE || !GUIDE.GATED[track]) return rem;
  const lim=guideMonth()+1;
  const open=rem.filter(i=>{ const it=(POOLS[track]||[])[i]; return !it || !it.g || it.g<=lim; });
  return open.length?open:rem;
}
function schedulable(track){
  const rem=remainingIdx(track);
  if(!rem.length) return false;
  if(!GUIDE.GATED[track]) return true;
  const lim=guideMonth()+1;
  return rem.some(i=>{ const it=(POOLS[track]||[])[i]; return !it.g || it.g<=lim; });
}
function taskOf(track, item){ return window.GUIDE?GUIDE.taskFor(track, item):""; }
function phaseLabel(){
  if(!window.GUIDE) return "";
  const f=GUIDE.focus(guideMonth(), unfinished);
  return TRACKS[f[0]]?TRACKS[f[0]].n:"";
}

/* ================= ShiftWise link ================= */
/* ShiftWise plans study around the shift roster and sends the exact blocks here ("#sw=");
   completed sessions go back to its log ("#ascend="). Everything travels inside the link. */
const SHIFTWISE_URL="https://pathumdilharadissanayake27980.github.io/Shiftwise/";
const SW_CODES={M:"Morning shift",D:"Day shift",N:"Night shift",G:"Graveyard shift",OFF:"Day off",LEAVE:"Leave",SICK:"Sick day",HOLIDAY:"Holiday"};
function b64urlEncode(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj)); let bin="";
  bytes.forEach(b=>{ bin+=String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(txt){
  if(!/^[A-Za-z0-9_-]{1,60000}$/.test(txt)) return null;
  try{ const bin=atob(txt.replace(/-/g,"+").replace(/_/g,"/")); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))); }
  catch(e){ return null; }
}
function validHandoff(h){
  if(!h || h.v!==1 || h.app!=="shiftwise" || !Array.isArray(h.days) || h.days.length>62) return false;
  const kinds={learn:1,build:1,cert:1};
  const mins=v=>v===undefined || (Number.isInteger(v) && v>=0 && v<=2880);
  return h.days.every(d=>d && /^\d{4}-\d{2}-\d{2}$/.test(d.d) && SW_CODES[d.c] && Array.isArray(d.b) && d.b.length<=12 &&
    mins(d.w) && mins(d.z) && (d.f===undefined || (typeof d.f==="number" && d.f>=0 && d.f<=100)) &&
    (d.s===undefined || (Array.isArray(d.s) && mins(d.s[0]) && mins(d.s[1]))) &&
    d.b.every(b=>Array.isArray(b) && Number.isInteger(b[0]) && Number.isInteger(b[1]) && b[0]>=0 && b[0]<1440 && b[1]>=15 && b[1]<=480 && kinds[b[2]]));
}
function applyShiftWise(h, quiet){
  const today=todayKey();
  const days=h.days.filter(d=>d.d>=today).sort((a,b)=>a.d<b.d?-1:1);
  if(!days.length){ toast("That ShiftWise plan is out of date. Open ShiftWise again."); return; }
  if(days.every(d=>!d.b.length)){
    // nothing linked on the ShiftWise side: keep the current schedule rather than blanking every day
    toast("ShiftWise sent no study blocks, so your schedule is unchanged. In ShiftWise: Activities → Balanced week, then open Ascend again.");
    return;
  }
  const month=guideMonth();
  const codes={}, info={};
  days.forEach(day=>{
    codes[day.d]=day.c;
    info[day.d]={c:day.c, s:day.s||null, w:day.w, z:day.z, f:day.f, fl:day.fl};
    const blocks=day.b.slice().sort((a,b)=>a[0]-b[0]);
    const base=Math.max(0,daysBetween(S.start, day.d))*4;
    // on a high-fatigue day new material is swapped for review: same time, lighter load
    const tired=typeof day.f==="number" && day.f>=50;
    const order=blocks.map((b,i)=>{ const t=GUIDE.trackFor(b[2], base+i, month, unfinished, schedulable); return (tired && b[2]==="learn")?"review":t; });
    S.custom[day.d]={n:"ShiftWise", sw:day.c, win:blocks.map(b=>[b[0], b[0]+b[1]]), fix:[], out:[],
      len:blocks.reduce((m,b)=>Math.max(m,b[1]),45), brk:10, every:99, order};
  });
  S.sw={at:h.at, got:Date.now(), week:h.week||null, from:days[0].d, until:days[days.length-1].d,
    codes:Object.assign({}, (S.sw&&S.sw.codes)||{}, codes), info:Object.assign({}, (S.sw&&S.sw.info)||{}, info)};
  Object.keys(S.sw.codes).forEach(k=>{ if(k<addDays(today,-30)){ delete S.sw.codes[k]; delete S.sw.info[k]; } });
  clearOrd(); replanFuture(days[0].d); save(); syncReminders();
  cursor=today; render();
  const mins=days.slice(0,7).reduce((t,d)=>t+d.b.reduce((a,b)=>a+b[1],0),0);
  toast((quiet?"ShiftWise updated your timetable: ":"Synced with ShiftWise: ")+(mins/60).toFixed(1)+"h of study fitted around your shifts this week.");
  publishWiring();
}
function swReceive(txt){
  const h=b64urlDecode(txt);
  if(!validHandoff(h)){ toast("That ShiftWise link could not be read."); return; }
  if(!window.GUIDE){ toast("The curriculum file is missing. Reinstall the app."); return; }
  applyShiftWise(h);
}
window.ascendReceive=swReceive;

/* ================= live wiring ================= */
/* Same browser: ShiftWise and the web version of Ascend share the github.io origin, so each reads the
   other's record from storage and reacts the moment it changes. Other devices and the Android app use
   encrypted files on the user's GitHub repo (S.cloud), set up with one tap from ShiftWise. */
const LOCAL_SHIFTWISE="wiring:shiftwise", LOCAL_ASCEND="wiring:ascend";
function upcomingLessons(){
  const up=[];
  for(let d=0; d<14 && up.length<120; d++){
    const k=addDays(todayKey(),d);
    (S.days[k]||(d<7?getDay(k):[])).forEach(it=>{

      up.push([k, Math.max(0,Math.min(2880,it.st)), Math.max(5,Math.min(600,it.m)), String(it.title||"").slice(0,200), String(tk||"").slice(0,400)]);

    });

let lastWired="";
function publishWiring(){

  const body=JSON.stringify(Object.assign({}, r, {at:0}));

function readShiftWiseLocal(raw, quiet){

/* ---- encrypted cloud wiring through GitHub (same format and key as ShiftWise's alerts) ---- */
const WIRING_SHIFTWISE="wiring/shiftwise.enc.json", WIRING_ASCEND="wiring/ascend.enc.json", WIRING_FORMAT="shiftwise-wiring";
function b64(bytes){ let s=""; bytes.forEach(b=>{ s+=String.fromCharCode(b); }); return btoa(s); }
function unb64(t){ const s=atob(t); const o=new Uint8Array(s.length); for(let i=0;i<s.length;i++) o[i]=s.charCodeAt(i); return o; }
async function aesKeyFor(pass, salt, iterations){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFKC")), "PBKDF2", false, ["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations}, base, 256);
  return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["encrypt","decrypt"]);
}
async function sealText(text, pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iterations=600000;
  const key=await aesKeyFor(pass, salt, iterations);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(text));
  return {alg:"AES-256-GCM", kdf:"PBKDF2-SHA256", iterations, salt:b64(salt), iv:b64(iv), ciphertext:b64(new Uint8Array(ct))};
}
async function openText(sealed, pass){
  if(!sealed || sealed.alg!=="AES-256-GCM" || sealed.iterations<100000 || sealed.iterations>5000000) throw new Error("format");
  const key=await aesKeyFor(pass, unb64(sealed.salt), sealed.iterations);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(sealed.iv)}, key, unb64(sealed.ciphertext)));
}
async function gh(path, init){
  const c=S.cloud;
  const res=await fetch("https://api.github.com/repos/"+c.repo+path, Object.assign({}, init||{}, {
    headers:{Accept:"application/vnd.github+json", Authorization:"Bearer "+c.token, "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json"},
    cache:"no-store"}));
  if(res.status===404) return null;
  if(!res.ok) throw new Error(res.status===401?"GitHub rejected the token (expired?). Reconnect from ShiftWise.":"GitHub error "+res.status);
  return res.json();
}
async function ghGet(file){
  const r=await gh("/contents/"+file+"?ref="+encodeURIComponent(S.cloud.branch));
  return r?{sha:r.sha, text:new TextDecoder().decode(unb64(r.content.replace(/\s/g,"")))}:null;
}
async function ghPut(file, text, sha){
  await gh("/contents/"+file, {method:"PUT", body:JSON.stringify({message:"Sync Ascend progress", content:b64(new TextEncoder().encode(text)), branch:S.cloud.branch, ...(sha?{sha}:{})})});
}
let cloudBusy=false, cloudTimer=null, lastCloudPush="";
function cloudSoon(){ clearTimeout(cloudTimer); cloudTimer=setTimeout(cloudSync, 20000); }
async function cloudSync(){
  if(!S.cloud || cloudBusy || (typeof navigator!=="undefined" && navigator.onLine===false)) return;
  cloudBusy=true;
  try{
    const f=await ghGet(WIRING_SHIFTWISE);
    if(f){
      const doc=JSON.parse(f.text);
      if(doc.format===WIRING_FORMAT){
        const h=JSON.parse(await openText(doc.sealed, S.cloud.key));
        if(validHandoff(h) && (!S.sw || h.at>S.sw.at) && !h.days.every(d=>!d.b.length)) applyShiftWise(h, true);
      }
    }
    const r=wiringReport();
    const body=JSON.stringify(Object.assign({}, r, {at:0}));
    if(body!==lastCloudPush){
      const sealed=await sealText(JSON.stringify(r), S.cloud.key);
      const cur=await ghGet(WIRING_ASCEND);
      await ghPut(WIRING_ASCEND, JSON.stringify({format:WIRING_FORMAT, version:1, updatedAt:r.at, sealed}), cur&&cur.sha);
      lastCloudPush=body;
    }
    S.cloud.ok=Date.now(); S.cloud.err=null; save();
  }catch(e){
    S.cloud.err=String(e&&e.message||e).slice(0,200); save();
  }finally{ cloudBusy=false; }
}
setInterval(cloudSync, 10*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) cloudSync(); });
function validLink(x){

    /^[A-Za-z0-9._\/-]{1,60}$/.test(x.branch) && typeof x.key==="string" && x.key.length>=24 && x.key.length<=128 &&
    /^(github_pat_|ghp_)[A-Za-z0-9_]{20,255}$/.test(x.token);

/* ================= stats ================= */
function dayComplete(k){
  const d=S.days[k]; if(!d) return false;
  const study=d.filter(i=>!REST(i.k));
  return study.length>0 && study.every(i=>i.done);
}
function isOffDay(k){
  try{ return structure(k).filter(b=>b.k==="study").length===0; }catch(e){ return false; }
}
function streak(){
  let cur = (dayComplete(todayKey()) || isOffDay(todayKey())) ? todayKey(): addDays(todayKey(),-1);
  let n=0, guard=0;
  while(guard++<500){
    if(isOffDay(cur)){ cur=addDays(cur,-1); continue; }   // rest days pause, never break
    if(!dayComplete(cur)) break;
    n++; cur=addDays(cur,-1);
  }
  return n;
}
function totals(){
  let done=0, mins=0;
  Object.values(S.days).forEach(items => items.forEach(i => {
    if(!REST(i.k) && i.done){ done++; mins += i.m; }
  }));
  return {done, hours: Math.round(mins/60)};
}
function trackStats(){
  const out={};
  Object.keys(TRACKS).forEach(k=>{ if(!REST(k)) out[k]={done:0,mins:0}; });
  Object.values(S.days).forEach(items => items.forEach(i => {
    if(out[i.k] && i.done){ out[i.k].done++; out[i.k].mins += i.m; }
  }));
  return out;
}

/* ask Google which models this key can actually use, so a retirement
   never strands the tutor again */
async function fetchGeminiModels(quiet){
  const c=aiCfg();
  if(!c.gkey.trim()) throw new Error("Add a Google AI Studio key first.");
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",
    {headers:{"x-goog-api-key":c.gkey.trim()}});
  if(!res.ok){
    let m="Could not list models ("+res.status+")";
    try{ const e=await res.json(); if(e.error&&e.error.message) m=e.error.message; }catch(_){}
    throw new Error(m);
  }
  const d=await res.json();
  const skip=/embedding|aqa|image|video|veo|imagen|tts|audio|live|robotics|learnlm/i;
  const list=(d.models||[])
    .filter(m=>(m.supportedGenerationMethods||[]).indexOf("generateContent")>=0)
    .map(m=>({id:(m.name||"").replace("models/",""), n:m.displayName||"", d:""}))
    .filter(m=>m.id && !skip.test(m.id) && !/preview|exp/i.test(m.id))
    .sort((a,b)=>{
      const rank=x=>(/flash-lite/.test(x)?1:/flash/.test(x)?0:2);
      return rank(a.id)-rank(b.id) || b.id.localeCompare(a.id);
    });
  if(!list.length) throw new Error("That key returned no usable chat models.");
  list.forEach(m=>{ m.d=/flash-lite/.test(m.id)?"cheapest, highest limit":/flash/.test(m.id)?"fast, recommended":"deepest, tighter limits"; });
  c.gmodels=list.slice(0,10);
  if(!c.gmodels.some(m=>m.id===c.gmodel)) c.gmodel=c.gmodels[0].id;
  save();
  if(!quiet) toast("Found "+c.gmodels.length+" models. Using "+c.gmodel+".");
  return c.gmodels;
}

async function aiCall(messages, retried){
  const c=aiCfg(), route=aiRoute();
  const system=AI_SYSTEM+(aiContextLine()?"\n\n"+aiContextLine():"");

  if(route==="gemini"){
    const url="https://generativelanguage.googleapis.com/v1beta/models/"+c.gmodel+":generateContent";
    const res=await fetch(url,{method:"POST",
      headers:{"content-type":"application/json","x-goog-api-key":c.gkey.trim()},
      body:JSON.stringify({
        system_instruction:{parts:[{text:system}]},
        contents:messages.map(m=>({role:m.role==="assistant"?"model":"user", parts:[{text:m.content}]})),
        generationConfig:{maxOutputTokens:1600}
      })});
    if(!res.ok){
      let msg="Request failed ("+res.status+")";
      try{ const e=await res.json(); if(e.error&&e.error.message) msg=e.error.message; }catch(_){}
      // the chosen model was retired: find a live one and try again, once
      if(!retried && /no longer available|not found|is not supported|not available to new users|deprecat/i.test(msg)){
        try{
          await fetchGeminiModels(true);
          toast("Model retired by Google. Switched to "+aiCfg().gmodel+".");
          return await aiCall(messages, true);
        }catch(_){ }
      }
      if(res.status===400 && /API key/i.test(msg)) msg="That Google AI Studio key was rejected. Check it in Settings.";
      if(res.status===429) msg="Free tier limit reached for now. Wait a minute, or pick Flash Lite in Settings.";
      throw new Error(msg);
    }
    const d=await res.json();
    const cand=(d.candidates||[])[0];
    if(!cand) throw new Error("No response returned.");
    if(cand.finishReason==="SAFETY") throw new Error("The model declined to answer that one.");
    return ((cand.content&&cand.content.parts)||[]).map(x=>x.text||"").join("").trim();
  }

  // Anthropic: with your key, or keyless when this page is open inside Claude
  const headers={"content-type":"application/json"};
  const keyed = route==="claude";
  if(keyed){
    headers["x-api-key"]=c.akey.trim();
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,
    body:JSON.stringify({model:keyed?c.amodel:"claude-sonnet-4-6", max_tokens:1400, system, messages})});
  if(!res.ok){
    let msg="Request failed ("+res.status+")";
    try{ const e=await res.json(); if(e.error&&e.error.message) msg=e.error.message; }catch(_){}
    if(res.status===401||res.status===403){
      msg = keyed ? "That Anthropic key was rejected. Check it in Settings.": "Keyless access only works while this page is open inside Claude. Add a free Google AI Studio key in Settings to use it on your phone.";
    }
    if(res.status===429) msg="Rate limited or out of credit. Try again shortly.";
    throw new Error(msg);
  }
  const data=await res.json();
  return (data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n").trim();
}

/* tiny markdown: code blocks, inline code, bold, lists */
function mdLite(t){
  const blocks=[];
  let src=String(t).replace(/```(\w+)?\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code>'+esc(code.replace(/\n+$/,""))+'</code></pre>');
    return "\u0000B"+(blocks.length-1)+"\u0000";
  });
  const inline=x=>esc(x).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<i>$1</i>');
  const out=[];
  let list=null;
  src.split("\n").forEach(line=>{
    const ph=line.match(/^\u0000B(\d+)\u0000$/);
    if(ph){ if(list){out.push("</"+list+">");list=null;} out.push(blocks[+ph[1]]); return; }
    const ul=line.match(/^\s*[-*+]\s+(.*)$/);
    const ol=line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if(ul){ if(list!=="ul"){ if(list)out.push("</"+list+">"); out.push("<ul>"); list="ul"; } out.push("<li>"+inline(ul[1])+"</li>"); return; }
    if(ol){ if(list!=="ol"){ if(list)out.push("</"+list+">"); out.push("<ol>"); list="ol"; } out.push("<li>"+inline(ol[2])+"</li>"); return; }
    if(list){ out.push("</"+list+">"); list=null; }
    const hd=line.match(/^#{1,4}\s+(.*)$/);
    if(hd){ out.push("<h5>"+inline(hd[1])+"</h5>"); return; }
    if(line.trim()==="") return;
    out.push("<p>"+inline(line)+"</p>");
  });
  if(list) out.push("</"+list+">");
  return out.join("");
}

async function sendAI(text){
  if(aiBusy) return;
  aiThread.push({role:"user", content:text});
  aiBusy=true; paintTutor();
  try{
    const reply=await aiCall(aiThread.map(m=>({role:m.role, content:m.content})));
    aiThread.push({role:"assistant", content:reply||"(empty response)"});
  }catch(e){
    aiThread.push({role:"assistant", content:"**Could not reach the tutor.** "+(e.message||e)+"\n\nIf you have not added an API key yet, open Settings and add one under AI tutor."});
  }
  aiBusy=false; paintTutor();
}

/* redistribute each day's subject rotation in proportion to what is still
   left in each track, so no track finishes years after the others */
function rebalancePlan(apply){
  const weekly={};
  Object.values(S.tmpl).forEach(t=>(t.order||[]).forEach(k=>{ weekly[k]=(weekly[k]||0)+1; }));
  const total=Object.values(weekly).reduce((a,b)=>a+b,0);
  if(!total) return null;

  const rem={}; let remTotal=0;
  Object.keys(TRACKS).forEach(k=>{
    if(REST(k)) return;
    const r=remainingIdx(k).length;
    if(!r) return;
    rem[k]=r; remTotal+=r;
  });
  if(!remTotal) return null;

  // floors so review, career and project never vanish
  const FLOOR={review:2, career:1, project:2, code:2, dsa:2};
  const target={};
  Object.keys(rem).forEach(k=>{
    target[k]=Math.max(FLOOR[k]||1, Math.round(total*rem[k]/remTotal));
  });
  // scale back to the number of sessions the week actually has
  let sum=Object.values(target).reduce((a,b)=>a+b,0);
  const keys=Object.keys(target).sort((a,b)=>target[b]-target[a]);
  let i=0;
  while(sum>total && i<400){
    const k=keys[i%keys.length];
    if(target[k]>(FLOOR[k]||1)){ target[k]--; sum--; }
    i++;
  }
  while(sum<total){ target[keys[0]]++; sum++; }

  if(apply){
    // build one long rotation, then deal it out across the days
    const bag=[];
    Object.keys(target).forEach(k=>{ for(let n=0;n<target[k];n++) bag.push(k); });
    bag.sort(()=>0);                        // keep deterministic
    const spread=[];
    const byTrack={}; bag.forEach(k=>{ (byTrack[k]=byTrack[k]||[]).push(k); });
    const order=Object.keys(byTrack).sort((a,b)=>byTrack[b].length-byTrack[a].length);
    let left=bag.length;
    while(left>0){
      for(const k of order){
        if(byTrack[k].length){ spread.push(byTrack[k].pop()); left--; }
      }
    }
    let p=0;
    for(let wd=0; wd<7; wd++){
      const t=S.tmpl[wd]; if(!t) continue;
      const n=(t.order||[]).length;
      const next=[];
      for(let j=0;j<n;j++){ next.push(spread[p%spread.length]); p++; }
      t.order=next;
    }
    clearOrd(); replanFuture(); save(); syncReminders();
  }
  return {weekly, target, rem, total};
}

let libTrack=null, libOpen={};

function markLesson(track, idx, on, quiet){
  if(!S.ldone) S.ldone={};
  const key=lkey(track,idx);
  if(on) S.ldone[key]=1; else delete S.ldone[key];
  clearOrd();
  const today=todayKey();
  // history keeps what happened; upcoming days give the slot to the next lesson
  Object.keys(S.days).forEach(d=>{
    S.days[d].forEach(it=>{
      if(it.k!==track || it.li!==idx) return;
      if(d<today){ it.done=!!on; return; }
      if(on && !it.done){
        const L=nextLesson(track,d);
        it.title=L.t; it.course=L.c; it.li=L.idx; it.done=false;
      }else if(on){ it.done=true; }
    });
  });
  replanFuture(); save();
  if(!quiet) syncReminders();
}

function coursesOf(track){
  const pool=POOLS[track]||[];
  const map={}, order=[];
  pool.forEach((raw,i)=>{
    const it=(typeof raw==="string")?{t:raw,c:""}:raw;
    const c=it.c||TRACKS[track].n;
    if(!map[c]){ map[c]=[]; order.push(c); }
    map[c].push({i, t:it.t});
  });
  return order.map(c=>({name:c, items:map[c]}));
}

function scheduledOn(track, idx){
  const keys=Object.keys(S.days).sort();
  for(const k of keys){
    if(k<todayKey()) continue;
    if(S.days[k].some(it=>it.k===track && it.li===idx && !it.done)) return k;
  }
  return null;
}
function scheduleNext(track, idx){
  const it=poolItem(track,idx);
  for(let d=0; d<14; d++){
    const k=addDays(todayKey(),d);
    const items=getDay(k);
    const slot=items.find(x=>x.k===track && !x.done);
    if(slot){
      slot.title=it.t; slot.course=it.c; slot.li=idx; slot.edited=true;
      save(); closeSheet(); render(); syncReminders();
      toast("Set for "+prettyDay(k).split(",")[0]+" at "+fmtTime(slot.st)+".");
      return;
    }
  }
  toast("No "+TRACKS[track].s+" slot in the next two weeks: add one from the day view.");
}

const NATIVE = (typeof AndroidBridge!=="undefined" && AndroidBridge && AndroidBridge.isNative);
function defRem(){ return {on:false, lead:5, what:"study", endping:true}; }
function remCfg(){ if(!S.rem) S.rem=defRem(); return S.rem; }

function remIncludes(k){
  const w=remCfg().what;
  if(w==="all") return true;
  if(w==="study") return !REST(k);
  if(w==="studybreak") return !REST(k) || k==="brk";
  return !REST(k);
}
function slotBody(it, dayKey){
  const T=TRACKS[it.k]||TRACKS.free;
  if(REST(it.k)) return fmtTime(it.st)+" · "+it.m+" min";
  return T.n+" · "+it.m+" min"+(it.course?" · "+it.course:"");
}

/* build the next N days of reminders as a flat list */
function buildReminders(days){
  const cfg=remCfg();
  const out=[];
  if(!cfg.on) return out;
  const now=Date.now();
  for(let d=0; d<(days||7); d++){
    const k=addDays(todayKey(), d);
    const items=getDay(k);
    const base=parseKey(k).getTime();
    items.forEach(it=>{
      if(!remIncludes(it.k)) return;
      const at=base + (it.st - cfg.lead)*60000;
      if(at<=now+5000) return;
      out.push({at, title:(cfg.lead?("In "+cfg.lead+" min: "):"Now: ")+it.title, body:slotBody(it,k)});
    });
    if(cfg.endping){
      const last=items[items.length-1];
      if(last){
        const at=base+(last.st+last.m)*60000;
        if(at>now) out.push({at, title:"Day complete: wind down", body:"Log what you finished, then sleep. Tomorrow starts again."});
      }
    }
  }
  out.sort((a,b)=>a.at-b.at);
  return out;
}

let webTimers=[];
function clearWebTimers(){ webTimers.forEach(t=>clearTimeout(t)); webTimers=[]; }
function syncReminders(){
  const cfg=remCfg();
  if(NATIVE){
    try{
      AndroidBridge.syncSchedule(JSON.stringify(cfg.on?buildReminders(7):[]));
    }catch(e){}
    return;
  }
  clearWebTimers();
  if(!cfg.on) return;
  if(typeof Notification==="undefined" || Notification.permission!=="granted") return;
  const list=buildReminders(1).slice(0,40);
  const now=Date.now();
  list.forEach(r=>{
    const delay=r.at-now;
    if(delay>0 && delay<26*3600*1000){
      webTimers.push(setTimeout(()=>{
        try{ new Notification(r.title,{body:r.body}); }catch(e){}
        syncReminders();
      }, delay));
    }
  });
}

function dayInfo(k){
  const st=structure(k);

  const done=stored?stored.filter(x=>!REST(x.k)&&x.done).length:0;

  return {off:study.length===0, mins, done, total, custom:!!S.custom[k]};

function applyPreset(id){
  const sel=[...calSel];
  let changed=0, skipped=0;
  sel.forEach(k=>{
    if((S.days[k]||[]).some(x=>x.done)){ skipped++; return; }
    if(id==="reset"){ delete S.custom[k]; delete S.days[k]; }
    else{
      const pz=allPresets().find(x=>x.id===id);
      if(!pz) return;
      const base=S.custom[k]||S.tmpl[parseKey(k).getDay()];
      const t=JSON.parse(JSON.stringify(base));
      t.win=JSON.parse(JSON.stringify(pz.win||[]));
      t.fix=JSON.parse(JSON.stringify(pz.fix||[]));
      if(pz.out) t.out=JSON.parse(JSON.stringify(pz.out));
      t.len=pz.len; t.brk=pz.brk; t.every=pz.every;
      t.out=(t.out||[]).filter(o=>t.win.some(w=>o[0]>=w[0]&&o[1]<=w[1]));
      S.custom[k]=t; delete S.days[k];
    }
    changed++;
  });
  clearOrd();
  if(sel.length) replanFuture(sel.sort()[0]);
  save(); calSel.clear(); render(); syncReminders();
  const label = id==="reset" ? "reset to your default": "set to "+(allPresets().find(x=>x.id===id)||{}).n.toLowerCase();
  toast(changed+" day"+(changed===1?"":"s")+" "+label+(skipped?" ("+skipped+" completed day"+(skipped>1?"s":"")+" left alone)":"")+".");
}

  const out=[];
  for(let i=1;i<=(lookback||14);i++){

    if(!d) continue;
    d.forEach(it=>{ if(!REST(it.k) && !it.done) out.push({k, it}); });

function doCatchUp(mode){
  const missed=missedItems(cursor,14);
  if(!missed.length){ closeSheet(); return; }
  if(mode==="drop"){
    missed.forEach(m=>{ const d=S.days[m.k]; const i=d.indexOf(m.it); if(i>=0) d.splice(i,1); retime(m.k); });
    save(); closeSheet(); render(); syncReminders();
    toast("Cleared. Start from where you are.");
    return;
  }
  const targets = mode==="today" ? [cursor]: Array.from({length:7},(_,i)=>addDays(cursor,i));
  let ti=0;
  missed.forEach(m=>{
    const d=S.days[m.k]; const i=d.indexOf(m.it); if(i>=0) d.splice(i,1);
    retime(m.k);
    let tk=targets[ti%targets.length]; ti++;
    if(mode==="spread"){
      // skip days with no room at all
      let guard=0;
      while(isOffDay(tk) && guard++<7){ tk=targets[ti%targets.length]; ti++; }
    }
    const tgt=getDay(tk);
    let ins=tgt.length;
    for(let j=tgt.length-1;j>=0;j--){ if(!REST(tgt[j].k)){ ins=j+1; break; } }
    tgt.splice(ins,0,Object.assign({},m.it,{id:uid(),done:false,edited:true}));
    retime(tk);
  });
  save(); closeSheet(); render(); syncReminders();
  toast(missed.length+" block"+(missed.length>1?"s":"")+" rescheduled.");
}

  if(!a||!b||b<a){ toast("Check those dates."); return; }
  const n=daysBetween(a,b);
  if(n>120){ toast("That is more than four months: pick a shorter stretch."); return; }
  for(let i=0;i<=n;i++){
    const k=addDays(a,i);
    if((S.days[k]||[]).some(x=>x.done)) continue;   // never rewrite finished days

let edCtx=null; // {mode:"week"|"date", wd, dateKey, t}

function cloneT(t){ return JSON.parse(JSON.stringify(t)); }
function hhmm(m){ const v=((m%1440)+1440)%1440; return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0"); }
function toMin(v){ const [h,m]=v.split(":").map(Number); return h*60+m; }
/* end times at/after midnight are stored as >1440 so a window can run past midnight */
function normEnd(startMin, endMin){ return endMin<=startMin ? endMin+1440: endMin; }

function openEditor(mode, key){
  const wd = mode==="week" ? +key: parseKey(key).getDay();
  const dateKey = mode==="date" ? key: null;
  const src = mode==="date" ? (S.custom[key] || S.tmpl[wd]): S.tmpl[wd];
  edCtx = {mode, wd, dateKey, t: cloneT(src)};
  paintEditor();
}

function previewStructure(t){
  const save=S.custom.__preview; S.custom.__preview=t;
  let st=[];
  try{ st=structureRaw("__preview"); }catch(e){}   // uncached: every preview is a different template
  if(save) S.custom.__preview=save; else delete S.custom.__preview;
  const study=st.filter(b=>b.k==="study");
  const mins=study.reduce((a,b)=>a+b.m,0);
  let warn="";
  const stray=(t.fix||[]).filter(f=>!(t.win||[]).some(w=>f[1]<w[1]&&f[1]+f[2]>w[0]));
  if(stray.length) warn=stray.length+" fixed block"+(stray.length>1?"s are":" is")+" outside your available time and will not be scheduled: that time is free anyway.";
  if(!st.length) warn="No time available: add a window.";
  else{
    const overlap=(t.fix||[]).some(f=>(t.out||[]).some(o=>f[1]<o[1]&&f[1]+f[2]>o[0]));
    if(overlap) warn="A fixed block overlaps a blackout: the blackout wins.";
    if(study.length===0 && st.length) warn="All the time is taken by fixed blocks: no study slots left.";
  }
  return {study:study.length, mins, range: st.length?(fmtTime(st[0].st)+" – "+fmtTime(st[st.length-1].st+st[st.length-1].m)):": ", warn};
}

function commitEditor(how){
  const t=edCtx.t;
  (t.win||[]).forEach(w=>{ w[1]=normEnd(w[0],w[1]); });
  if(how==="week" || how==="weekfromdate"){
    t.n=DAYNAMES[edCtx.wd];
    S.tmpl[edCtx.wd]=t;
    if(how==="weekfromdate") delete S.custom[edCtx.dateKey];
    replanFuture();
    toast(DAYNAMES[edCtx.wd]+" default updated. Future "+DAYNAMES[edCtx.wd]+"s replanned.");
  }else{
    S.custom[edCtx.dateKey]=t;
    clearOrd();
    if(!(S.days[edCtx.dateKey]||[]).some(x=>x.done)) delete S.days[edCtx.dateKey];
    replanFuture(edCtx.dateKey);
    toast("Custom plan saved for "+prettyDay(edCtx.dateKey).split(",")[0]+".");
  }
  save(); closeSheet(); render(); syncReminders();
}

/* ================= action sheet ================= */
let sheetOpen=false, sheetSuppressClick=false;
function openSheet(html){
  const sh=$("#sheet"), sc=$("#sheetscrim");
  $("#sheetbody").innerHTML=html;
  sh.style.transform="";
  sh.classList.remove("dragging");
  sh.classList.add("open");
  sh.scrollTop=0;
  sc.hidden=false;
  requestAnimationFrame(()=>sc.classList.add("on"));
  document.body.classList.add("sheet-open");
  sheetOpen=true;
}
function closeSheet(){
  const sh=$("#sheet"), sc=$("#sheetscrim");
  if(!sheetOpen && !sh.classList.contains("open")) return;
  sh.classList.remove("dragging");
  sh.style.transform="";
  sh.classList.remove("open");
  sc.classList.remove("on");
  setTimeout(()=>{ if(!sheetOpen) sc.hidden=true; }, 300);
  document.body.classList.remove("sheet-open");
  sheetOpen=false;
}

/* drag the sheet down to dismiss, with rubber banding and a velocity flick */
function wireSheetDrag(){
  const sh=$("#sheet"), sc=$("#sheetscrim"), grab=$("#sheetgrab");
  let dragging=false, startY=0, dy=0, startT=0, height=0, lastY=0, lastT=0, vel=0, moved=false, pid=null;

  const canStartFrom=t=>{
    if(grab.contains(t)) return true;                       // the grabber always drags
    if(t.closest("input,select,textarea,pre,.chat")) return false;
    return sh.scrollTop<=0;                                 // otherwise only at the top
  };
  const begin=e=>{
    if(!sheetOpen || e.pointerType==="mouse" && !grab.contains(e.target)) {
      if(!grab.contains(e.target)) return;
    }
    if(!canStartFrom(e.target)) return;
    dragging=true; moved=false;
    startY=lastY=e.clientY; startT=lastT=performance.now();
    dy=0; vel=0; height=sh.getBoundingClientRect().height; pid=e.pointerId;
  };
  const move=e=>{
    if(!dragging) return;
    const raw=e.clientY-startY;
    if(!moved && Math.abs(raw)<5) return;
    if(!moved){ moved=true; try{ sh.setPointerCapture(pid); }catch(_){} }
    dy = raw<0 ? raw/4 : raw;                                // resist upward pull
    const now=performance.now();
    if(now-lastT>8){ vel=(e.clientY-lastY)/(now-lastT); lastY=e.clientY; lastT=now; }
    sh.classList.add("dragging");
    sh.style.transform="translate3d(0,"+dy+"px,0)";
    sc.style.opacity=String(Math.max(0, 1-(dy/height)*1.25));
  };
  const end=()=>{
    if(!dragging) return;
    dragging=false;
    if(pid!=null){ try{ sh.releasePointerCapture(pid); }catch(_){} pid=null; }
    sh.classList.remove("dragging");
    sc.style.opacity="";
    if(moved){
      sheetSuppressClick=true;
      setTimeout(()=>{ sheetSuppressClick=false; }, 60);
    }
    const flick = vel>0.55;                                  // fast downward flick
    const far   = dy > height*0.3;
    if(moved && (flick||far)){
      try{ navigator.vibrate && navigator.vibrate(8); }catch(_){}
      sh.style.transform="";
      closeSheet();
    }else{
      sh.style.transform="";                                 // spring back
    }
    dy=0; vel=0;
  };
  sh.addEventListener("pointerdown", begin);
  sh.addEventListener("pointermove", move, {passive:true});
  sh.addEventListener("pointerup", end);
  sh.addEventListener("pointercancel", end);
  sc.addEventListener("click", closeSheet);
}

function findItem(id){
  for(const k in S.days){
    const i=S.days[k].findIndex(x=>x.id===id);
    if(i>=0) return {k, i, it:S.days[k][i]};
  }
  return null;
}

let deferMode="fill";

function doDefer(id, toKey){
  const f=findItem(id); if(!f) return;
  const {k,i,it}=f;
  const target=getDay(toKey);
  const copy=Object.assign({}, it, {id:uid(), done:false});
  // insert into target at a sensible place: before trailing rest blocks
  let ins=target.length;
  for(let j=target.length-1;j>=0;j--){ if(!REST(target[j].k)){ ins=j+1; break; } }
  target.splice(ins,0,copy);
  if(deferMode==="close"){
    S.days[k].splice(i,1);
  }else if(deferMode==="free"){
    S.days[k][i]={id:uid(), k:"free", m:it.m, st:it.st, done:false, title:"Free time, yours to use"};
  }else{
    const L=nextLesson(it.k, k);
    S.days[k][i]=Object.assign({}, it, {id:uid(), title:L.t, course:L.c, done:false});
  }
  retime(k); retime(toKey); save(); closeSheet(); render(); syncReminders();
  toast("Moved to "+prettyDay(toKey).split(",")[0]+".");
}

/* ================= drag & drop ================= */
let drag=null;
function wireDrag(){
  const box=$("#slots"); if(!box) return;
  const GAP=8;
  box.querySelectorAll("[data-grip]").forEach(g=>{
    g.addEventListener("pointerdown", e=>{
      e.preventDefault(); e.stopPropagation();
      const el=g.closest(".slot");
      const slots=[...box.querySelectorAll(".slot")];
      const idx=slots.indexOf(el);
      const rects=slots.map(s=>s.getBoundingClientRect());
      drag={el, box, slots, rects, idx, target:idx, startY:e.clientY, h:rects[idx].height+GAP};
      el.classList.add("drag");
      document.body.style.userSelect="none";
      g.setPointerCapture(e.pointerId);
    });
    g.addEventListener("pointermove", e=>{
      if(!drag) return;
      const dy=e.clientY-drag.startY;
      drag.el.style.transform="translateY("+dy+"px)";
      // where would it land?
      let t=drag.idx;
      const mid=drag.rects[drag.idx].top + drag.rects[drag.idx].height/2 + dy;
      for(let i=0;i<drag.rects.length;i++){
        if(i===drag.idx) continue;
        const c=drag.rects[i].top+drag.rects[i].height/2;
        if(i<drag.idx && mid<c){ t=Math.min(t,i); }
        if(i>drag.idx && mid>c){ t=Math.max(t,i); }
      }
      drag.target=t;
      // shift the others to open a gap
      drag.slots.forEach((s,i)=>{
        if(i===drag.idx) return;
        let shift=0;
        if(t>drag.idx && i>drag.idx && i<=t) shift=-drag.h;
        if(t<drag.idx && i<drag.idx && i>=t) shift=drag.h;
        s.style.transform = shift ? "translateY("+shift+"px)": "";
        s.style.transition = "transform.16s ease";
      });
    });
    const finish=()=>{
      if(!drag) return;
      const {idx,target}=drag;
      drag.slots.forEach(s=>{ s.style.transform=""; s.style.transition=""; });
      drag.el.classList.remove("drag");
      document.body.style.userSelect="";
      drag=null;
      if(target!==idx){
        const arr=S.days[cursor];
        const [moved]=arr.splice(idx,1);
        arr.splice(target,0,moved);
        retime(cursor); save();
        renderDay(); paintHeader();
        toast("Moved to "+fmtTime(S.days[cursor][target].st)+".");
      }
    };
    g.addEventListener("pointerup", finish);
    g.addEventListener("pointercancel", finish);
    g.addEventListener("lostpointercapture", finish);
  });
}

let wdrag=null;
function wireWeekDrag(){
  document.querySelectorAll(".witem").forEach(el=>{
    el.addEventListener("pointerdown", e=>{
      wdrag={id:el.dataset.id, from:el.dataset.day, el};
      el.style.opacity=".4";
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", e=>{
      if(!wdrag) return;
      document.querySelectorAll(".wday").forEach(d=>d.classList.remove("over"));
      const t=document.elementFromPoint(e.clientX,e.clientY);
      const day=t&&t.closest(".wday");
      if(day) day.classList.add("over");
    });
    const end=e=>{
      if(!wdrag) return;
      const t=document.elementFromPoint(e.clientX,e.clientY);
      const day=t&&t.closest(".wday");
      wdrag.el.style.opacity="";
      document.querySelectorAll(".wday").forEach(d=>d.classList.remove("over"));
      const target=day&&day.dataset.drop;
      const {id,from}=wdrag; wdrag=null;
      if(target && target!==from){
        const f=findItem(id);
        if(f){
          const it=f.it;
          S.days[from].splice(f.i,1);
          const tgt=getDay(target);
          let ins=tgt.length;
          for(let j=tgt.length-1;j>=0;j--){ if(!REST(tgt[j].k)){ ins=j+1; break; } }
          tgt.splice(ins,0,Object.assign({},it,{id:uid()}));
          retime(from); retime(target); save(); render();
          toast("Moved to "+DAYNAMES[parseKey(target).getDay()]+".");
        }
      }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", ()=>{ if(wdrag){ wdrag.el.style.opacity=""; wdrag=null; } });
  });
}

function dl(blob,name){ const u=URL.createObjectURL(blob),a=document.createElement("a"); a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(u),900); }
function exportJSON(){ const c=JSON.parse(JSON.stringify(S)); delete c.cloud; dl(new Blob([JSON.stringify(c,null,1)],{type:"application/json"}), "ascend-progress-"+todayKey()+".json"); toast("Backup exported."); }
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.days) throw 0; S=Object.assign(S,d); applyLook(); save(); render(); toast("Backup restored."); }catch(e){ toast("That is not a valid backup file."); } };
  r.readAsText(file);
}
function saveCopy(){

function updateDayMeter(){
  const items=S.days[cursor]||[];
  const study=items.filter(i=>!REST(i.k));
  const done=study.filter(i=>i.done).length;
  const pct=study.length?Math.round(done/study.length*100):0;
  const ring=document.querySelector(".rfg");
  if(ring) ring.style.strokeDashoffset=(220*(1-pct/100)).toFixed(1);
  const rt=document.querySelector(".ringtxt");
  if(rt) rt.innerHTML="<b>"+pct+"%</b><span>"+done+"/"+study.length+"</span>";
  const mini=document.querySelectorAll(".mini div b");
  if(mini.length>=3){ mini[1].textContent=(doneMins(items)/60).toFixed(1)+"h"; mini[2].textContent=streak(); }
