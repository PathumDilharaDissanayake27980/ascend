/* ================= render switch ================= */

/* swipe the drawer left to close it */
function wireDrawerDrag(){
  const el=$("#side");
  if(!el) return;
  let on=false, x0=0, dx=0, w=0, lastX=0, lastT=0, v=0, moved=false, pid=null;
  el.addEventListener("pointerdown", e=>{
    if(!document.body.classList.contains("nav-open")) return;
    if(e.target.closest("input,select,textarea")) return;
    on=true; moved=false; x0=lastX=e.clientX; lastT=performance.now(); dx=0; v=0;
    w=el.getBoundingClientRect().width; pid=e.pointerId;
  });
  el.addEventListener("pointermove", e=>{
    if(!on) return;
    const raw=e.clientX-x0;
    if(!moved && Math.abs(raw)<6) return;
    if(!moved){ moved=true; try{ el.setPointerCapture(pid); }catch(_){} }
    dx = raw>0 ? raw/4 : raw;
    const now=performance.now();
    if(now-lastT>8){ v=(e.clientX-lastX)/(now-lastT); lastX=e.clientX; lastT=now; }
    el.style.transition="none";
    el.style.transform="translate3d("+dx+"px,0,0)";
    const sc=$("#scrim"); if(sc) sc.style.opacity=String(Math.max(0,1-Math.abs(dx)/w));
  }, {passive:true});
  const end=()=>{
    if(!on) return;
    on=false;
    if(pid!=null){ try{ el.releasePointerCapture(pid); }catch(_){} pid=null; }
    el.style.transition=""; el.style.transform="";
    const sc=$("#scrim"); if(sc) sc.style.opacity="";
    if(moved){ sheetSuppressClick=true; setTimeout(()=>{ sheetSuppressClick=false; },60); }
    if(moved && (dx < -w*0.3 || v < -0.5)){
      try{ navigator.vibrate && navigator.vibrate(8); }catch(_){}
      closeNav();
    }
    dx=0; v=0;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

    if((el=hit("data-i-edit"))){
      const f=findItem(el.dataset.iEdit); if(!f) return;
      openSheet('<h4>Edit block</h4><div class="meta">Rename it to whatever you are actually doing.</div><label class="fl">Title</label><input type="text" id="etitle" value="'+esc(f.it.title)+'"><div style="height:10px"></div><button class="sbtn" data-savetitle="'+f.it.id+'" style="width:100%;text-align:center">Save</button>');
      setTimeout(()=>{ const i=$("#etitle"); if(i){ i.focus(); i.select(); } },80);
      return;
    }
    if((el=hit("data-savetitle"))){
      const f=findItem(el.dataset.savetitle), v=$("#etitle").value.trim();
      if(f&&v){ f.it.title=v; save(); closeSheet(); render(); }
      return;
    }
    if((el=hit("data-i-del"))){
      const f=findItem(el.dataset.iDel);
      if(f){ S.days[f.k].splice(f.i,1); retime(f.k); save(); closeSheet(); render(); toast("Block removed."); }
      return;
    }
    if((el=hit("data-dmode"))){ deferMode=el.dataset.dmode; const id=$("#dpick")?null:null; toast("Slot will: "+({fill:"get a new lesson",free:"become free time",close:"close the gap"}[deferMode])); return; }
    if((el=hit("data-dmove"))){
      const [id,n]=el.dataset.dmove.split("|");
      const f=findItem(id); if(f) doDefer(id, addDays(f.k, +n));
      return;
    }
    if((el=hit("data-dpickgo"))){
      const id=el.dataset.dpickgo, v=$("#dpick").value;
      if(v) doDefer(id, v);
      return;
    }
    if((el=hit("data-addtrack"))){
      const k=el.dataset.addtrack;
      const items=getDay(cursor);
      const it={id:uid(), k, m:REST(k)?(k==="din"?35:k==="ent"?60:10):45, done:false, st:0};
      if(REST(k)) it.title=RESTNAME[k]||TRACKS[k].n;
      else { const L=nextLesson(k,cursor); it.title=L.t; it.course=L.c; }
      items.push(it); retime(cursor); save(); closeSheet(); render(); toast("Block added."); syncReminders();
      return;
    }
    if((el=hit("data-addcustom"))){
      const v=$("#custom").value.trim();
      if(!v){ toast("Give it a name first."); return; }
      const items=getDay(cursor);
      items.push({id:uid(), k:"free", m:45, done:false, st:0, title:v});
      retime(cursor); save(); closeSheet(); render(); toast("Added.");
      return;
    }
    if((el=hit("data-accent"))){ S.accent=el.dataset.accent; applyLook(); save(); render(); return; }
    if((el=hit("data-wall"))){ S.wallpaper=el.dataset.wall==="1"; applyLook(); save(); render(); return; }
    if(sheetOpen && !t.closest("#sheet") && !t.closest("#sheetscrim")) closeSheet();
  });

  document.addEventListener("change", e=>{
    const t=e.target;
    if(t.dataset.win!=null && edCtx){
      const [i,j]=t.dataset.win.split("-").map(Number);
      edCtx.t.win[i][j]=toMin(t.value);
      if(j===1) edCtx.t.win[i][1]=normEnd(edCtx.t.win[i][0], edCtx.t.win[i][1]);
      paintEditor(); return;
    }
    if(t.dataset.out!=null && edCtx){
      const [i,j]=t.dataset.out.split("-").map(Number);
      edCtx.t.out[i][j]=toMin(t.value);
      if(j===1) edCtx.t.out[i][1]=normEnd(edCtx.t.out[i][0], edCtx.t.out[i][1]);
      paintEditor(); return;
    }
    if(t.dataset.fixt!=null && edCtx){ edCtx.t.fix[+t.dataset.fixt][1]=toMin(t.value); paintEditor(); return; }
    if(t.dataset.fixm!=null && edCtx){ edCtx.t.fix[+t.dataset.fixm][2]=Math.max(5,+t.value||5); paintEditor(); return; }
    if(t.dataset.fixk!=null && edCtx){ edCtx.t.fix[+t.dataset.fixk][0]=t.value; paintEditor(); return; }
    if(t.dataset.startdate!=null && t.value){ S.start=t.value; S.days={}; clearOrd(); save(); render(); syncReminders(); toast("Plan start moved."); }
  });
}

/* ================= wallpaper ================= */
function wallpaper(){
  const cv=$("#wall"); if(!cv||!cv.getContext) return;
  const ctx=cv.getContext("2d");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr=Math.min(devicePixelRatio||1,1.5);
  let W,H,N=[],raf=null; const ms={x:-9e9,y:-9e9};
  function seed(){
    const lowEnd=(navigator.hardwareConcurrency||4)<=4 || (navigator.deviceMemory||4)<4;
    const c=lowEnd?14:Math.min(30,Math.max(12,Math.floor(innerWidth*innerHeight/46000)));
    N=Array.from({length:c},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2*dpr,vy:(Math.random()-.5)*.2*dpr,r:(Math.random()*1.3+.7)*dpr,a:Math.random()<.16}));
  }
  function size(){ W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px"; seed(); }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const link=150*dpr, rad=125*dpr;
    for(const n of N){
      n.x+=n.vx; n.y+=n.vy;
      const dx=n.x-ms.x, dy=n.y-ms.y, d2=dx*dx+dy*dy;
      if(d2<rad*rad&&d2>0){ const d=Math.sqrt(d2); n.x+=dx/d*.5; n.y+=dy/d*.5; }
      if(n.x<0)n.x+=W; if(n.x>W)n.x-=W; if(n.y<0)n.y+=H; if(n.y>H)n.y-=H;
    }
    ctx.lineWidth=dpr*.65;
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      const a=N[i],b=N[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;
      if(d2<link*link){ ctx.strokeStyle="rgba(111,167,255,"+((1-Math.sqrt(d2)/link)*.14).toFixed(3)+")"; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    const acc=S.accent||"#FFB454";
    for(const n of N){ ctx.fillStyle=n.a?acc+"99":"rgba(111,167,255,.38)"; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.2832); ctx.fill(); }
  }
  let last=0;
  function loop(ts){
    raf=requestAnimationFrame(loop);
    if(ts-last<33) return;                       // ~30fps is plenty for drifting dots
    last=ts;
    if(document.body.classList.contains("nav-open")) return;   // covered, skip work
    if(document.getElementById("sheet").classList.contains("open")) return;
    draw();
  }
  addEventListener("resize",size,{passive:true});
  addEventListener("pointermove",e=>{ ms.x=e.clientX*dpr; ms.y=e.clientY*dpr; },{passive:true});
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){cancelAnimationFrame(raf);raf=null;} else if(!reduced&&S.wallpaper&&!raf) loop(); });
  size(); reduced?draw():requestAnimationFrame(loop);
}

/* ================= boot ================= */
(async function(){
  await load();
  applyLook();
  wireGlobal();
  wireSheetDrag();
  wireDrawerDrag();
  cursor=todayKey();
  render();
  wallpaper();
  syncReminders();
  let anchorDay=todayKey();
  setInterval(()=>{
    if(todayKey()!==anchorDay){ anchorDay=todayKey(); clearOrd(); replanFuture(); render(); syncReminders(); return; }
    if(view==="today"&&cursor===todayKey()) renderDay();
  }, 60000);
  if(seeded) toast("Loaded the plan saved inside this file.");
  if(migrated && !seeded){ replanFuture(); save(); toast("Updated: the six-track career guide is in, and study now fits around your shifts from ShiftWise."); }
  { const m=/^#(sw|link)=([A-Za-z0-9_-]+)$/.exec(location.hash);
    if(m){ history.replaceState(null,"",location.pathname+location.search); if(m[1]==="sw") swReceive(m[2]); else linkReceive(m[2]); } }
  try{ readShiftWiseLocal(localStorage.getItem(LOCAL_SHIFTWISE), true); }catch(e){}
  publishWiring();
  if(S.cloud) setTimeout(cloudSync, 1500);
})();
</script>
