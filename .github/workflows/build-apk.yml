# Builds the Android app on every push to main and publishes it as the latest GitHub Release:
# https://github.com/PathumDilharaDissanayake27980/ascend/releases/latest/download/ascend.apk
name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the web app's scripts parse
        run: |
          node -e 'const fs=require("fs");const h=fs.readFileSync("app/src/main/assets/index.html","utf8");const m=h.match(/<script>\n([\s\S]*)<\/script>\s*<\/body>/);new Function(m[1]);global.window={};require("./app/src/main/assets/guide.js");if(!window.GUIDE)process.exit(1);console.log("ok")'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ASCEND_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ascend.jks"
            echo "ASCEND_KEYSTORE=$RUNNER_TEMP/ascend.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No ASCEND_KEYSTORE_B64 secret, building a debug APK. Updates will not install over a previous version."
          fi

      - name: Build APK
        env:
          ASCEND_KEYSTORE_PASSWORD: ${{ secrets.ASCEND_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ascend.apk
          else
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ascend.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-apk
          path: ascend.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ascend.apk \
            --title "Ascend 2.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install over the previous version; your progress is kept." \
            --latest
